##############################################################
# SmartLinkNet FreeRADIUS — mods-config/sql.conf
# PostgreSQL backend reading SmartLinkNet Supabase DB views
##############################################################

sql {
  driver        = "rlm_sql_postgresql"
  dialect       = "postgresql"

  # ── Connection — filled in by setup.sh from environment ──
  server        = "${DB_HOST}"
  port          = "${DB_PORT}"
  login         = "${DB_USER}"
  password      = "${DB_PASS}"
  radius_db     = "${DB_NAME}"

  # TLS required for Supabase
  postgresql {
    send_application_name = yes
    tls {
      mode = "require"
    }
  }

  # ── Table/view names — map to SmartLinkNet SQL views ─────
  acct_table1   = "radacct"
  acct_table2   = "radacct"
  postauth_table = "radpostauth"
  authcheck_table = "radcheck"
  groupcheck_table = "radgroupcheck"
  authreply_table  = "radreply"
  groupreply_table = "radgroupreply"
  usergroup_table  = "radusergroup"
  nas_table        = "nas"

  # ── Read clients (NAS devices) from DB ───────────────────
  read_clients  = yes
  client_table  = "nas"

  # ── Column mappings for nas table ────────────────────────
  client {
    identifier  = "nasname"
    shortname   = "shortname"
    secret      = "secret"
    server      = "server"
    type        = "type"
    virtual_server = "server"
  }

  # ── Connection pool ───────────────────────────────────────
  pool {
    start       = 5
    min         = 3
    max         = 32
    spare       = 3
    uses        = 0
    retry_delay = 30
    lifetime    = 1800
    idle_timeout = 60
  }

  # ── Query customisation ───────────────────────────────────
  # Use default rlm_sql queries — they work with our view column names.
  # Override only the accounting queries to match radacct schema.

  accounting {
    reference = "%{tolower:type.%{Acct-Status-Type}.query}"

    type {
      accounting-on {
        query = "\
          UPDATE ${....acct_table1} \
          SET acctstoptime = NOW(), \
              acctsessiontime = EXTRACT(EPOCH FROM (NOW() - acctstarttime))::integer, \
              acctterminatecause = 'NAS-Reboot' \
          WHERE nasipaddress = '%{NAS-IP-Address}' \
            AND acctstoptime IS NULL"
      }

      accounting-off {
        query = "\
          UPDATE ${....acct_table1} \
          SET acctstoptime = NOW(), \
              acctsessiontime = EXTRACT(EPOCH FROM (NOW() - acctstarttime))::integer, \
              acctterminatecause = 'NAS-Reboot' \
          WHERE nasipaddress = '%{NAS-IP-Address}' \
            AND acctstoptime IS NULL"
      }

      start {
        query = "\
          INSERT INTO ${....acct_table1} \
            (acctsessionid, acctuniqueid, username, realm, \
             nasipaddress, nasportid, nasporttype, \
             acctstarttime, acctupdatetime, acctauthentic, \
             calledstationid, callingstationid, \
             servicetype, framedprotocol, framedipaddress, \
             acctinputoctets, acctoutputoctets, acctinterval) \
          VALUES \
            ('%{Acct-Session-Id}', '%{Acct-Unique-Session-Id}', \
             '%{SQL-User-Name}', '%{Realm}', \
             '%{NAS-IP-Address}', '%{NAS-Port-Id}', '%{NAS-Port-Type}', \
             TO_TIMESTAMP(%{integer:Event-Timestamp}), NOW(), '%{Acct-Authentic}', \
             '%{Called-Station-Id}', '%{Calling-Station-Id}', \
             '%{Service-Type}', '%{Framed-Protocol}', '%{Framed-IP-Address}', \
             0, 0, %{%{Acct-Interim-Interval}:-0}) \
          ON CONFLICT (acctuniqueid) DO UPDATE SET \
             acctstarttime = TO_TIMESTAMP(%{integer:Event-Timestamp}), \
             acctupdatetime = NOW()"
      }

      interim-update {
        query = "\
          UPDATE ${....acct_table1} \
          SET acctupdatetime = NOW(), \
              acctinputoctets  = %{Acct-Input-Octets}, \
              acctoutputoctets = %{Acct-Output-Octets}, \
              acctsessiontime  = %{Acct-Session-Time}, \
              framedipaddress  = '%{Framed-IP-Address}' \
          WHERE acctuniqueid = '%{Acct-Unique-Session-Id}' \
            AND acctstoptime IS NULL"
      }

      stop {
        query = "\
          UPDATE ${....acct_table1} \
          SET acctstoptime       = TO_TIMESTAMP(%{integer:Event-Timestamp}), \
              acctupdatetime     = NOW(), \
              acctsessiontime    = %{Acct-Session-Time}, \
              acctinputoctets    = %{Acct-Input-Octets}, \
              acctoutputoctets   = %{Acct-Output-Octets}, \
              acctterminatecause = '%{Acct-Terminate-Cause}', \
              framedipaddress    = '%{Framed-IP-Address}', \
              connectinfo_stop   = '%{Connect-Info}' \
          WHERE acctuniqueid = '%{Acct-Unique-Session-Id}'"
      }
    }
  }

  # Post-auth logging
  post-auth {
    reference = "queries.post-auth"
    query = "\
      INSERT INTO ${...postauth_table} \
        (username, pass, reply, nasipaddress, nasportid, authdate, class) \
      VALUES \
        ('%{SQL-User-Name}', '%{%{User-Password}:-Chap-Password}', \
         '%{reply:Packet-Type}', '%{NAS-IP-Address}', '%{NAS-Port-Id}', \
         NOW(), '%{Class}')"
  }
}
