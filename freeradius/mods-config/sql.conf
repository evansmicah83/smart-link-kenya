##############################################################
# SmartLinkNet FreeRADIUS — mods-available/sql
#
# Written by setup.sh from environment variables.
# FreeRADIUS reads SmartLinkNet PostgreSQL views directly:
#   radcheck      → subscriptions + vouchers (auth credentials)
#   radreply      → Mikrotik-Rate-Limit, Session-Timeout, Simultaneous-Use
#   radgroupcheck → per-package group policies
#   radgroupreply → per-package group reply attributes
#   radusergroup  → subscription → package group mapping
#   nas           → nas_devices (RADIUS client validation)
#   radacct       → FreeRADIUS writes accounting here (real table)
#   radpostauth   → FreeRADIUS writes post-auth log here (real table)
##############################################################

sql {
  driver   = "rlm_sql_postgresql"
  dialect  = "postgresql"

  # ── Connection (written by setup.sh) ─────────────────────
  server   = "${DB_HOST}"
  port     = ${DB_PORT}
  login    = "${DB_USER}"
  password = "${DB_PASS}"
  radius_db = "${DB_NAME}"

  # TLS required for Supabase PostgreSQL
  postgresql {
    send_application_name = yes
    tls {
      mode = "require"
    }
  }

  # ── Table / view names ────────────────────────────────────
  acct_table1      = "radacct"
  acct_table2      = "radacct"
  postauth_table   = "radpostauth"
  authcheck_table  = "radcheck"
  groupcheck_table = "radgroupcheck"
  authreply_table  = "radreply"
  groupreply_table = "radgroupreply"
  usergroup_table  = "radusergroup"
  nas_table        = "nas"

  # ── Read NAS clients from DB ──────────────────────────────
  read_clients = yes
  client_table = "nas"

  client {
    identifier     = "nasname"
    shortname      = "shortname"
    secret         = "secret"
    server         = "server"
    type           = "type"
    virtual_server = "server"
  }

  # ── Connection pool ───────────────────────────────────────
  pool {
    start        = 5
    min          = 3
    max          = 32
    spare        = 3
    uses         = 0
    retry_delay  = 30
    lifetime     = 1800
    idle_timeout = 60
  }

  # ── Accounting queries ────────────────────────────────────
  # Use explicit table name (not variable expansion) — rlm_sql_postgresql
  # does not expand ${....acct_table1} inside inline query strings.

  accounting {
    reference = "%{tolower:type.%{Acct-Status-Type}.query}"

    type {
      accounting-on {
        query = "\
          UPDATE radacct \
          SET    acctstoptime       = NOW(), \
                 acctsessiontime    = EXTRACT(EPOCH FROM (NOW() - acctstarttime))::integer, \
                 acctterminatecause = 'NAS-Reboot' \
          WHERE  nasipaddress = '%{NAS-IP-Address}' \
            AND  acctstoptime IS NULL"
      }

      accounting-off {
        query = "\
          UPDATE radacct \
          SET    acctstoptime       = NOW(), \
                 acctsessiontime    = EXTRACT(EPOCH FROM (NOW() - acctstarttime))::integer, \
                 acctterminatecause = 'NAS-Reboot' \
          WHERE  nasipaddress = '%{NAS-IP-Address}' \
            AND  acctstoptime IS NULL"
      }

      start {
        query = "\
          INSERT INTO radacct \
            (acctsessionid, acctuniqueid, username, realm, \
             nasipaddress, nasportid, nasporttype, \
             acctstarttime, acctupdatetime, acctauthentic, \
             calledstationid, callingstationid, \
             servicetype, framedprotocol, framedipaddress, \
             acctinputoctets, acctoutputoctets, acctinterval) \
          VALUES \
            ('%{Acct-Session-Id}', '%{Acct-Unique-Session-Id}', \
             '%{SQL-User-Name}', '%{Realm}', \
             '%{NAS-IP-Address}', '%{NAS-Port-Id}', '%{NAS-Port-Type}', \
             TO_TIMESTAMP(%{integer:Event-Timestamp}), NOW(), '%{Acct-Authentic}', \
             '%{Called-Station-Id}', '%{Calling-Station-Id}', \
             '%{Service-Type}', '%{Framed-Protocol}', '%{Framed-IP-Address}', \
             0, 0, %{%{Acct-Interim-Interval}:-0}) \
          ON CONFLICT (acctuniqueid) DO UPDATE SET \
             acctstarttime  = TO_TIMESTAMP(%{integer:Event-Timestamp}), \
             acctupdatetime = NOW()"
      }

      interim-update {
        query = "\
          UPDATE radacct \
          SET    acctupdatetime   = NOW(), \
                 acctinputoctets  = %{Acct-Input-Octets}, \
                 acctoutputoctets = %{Acct-Output-Octets}, \
                 acctsessiontime  = %{Acct-Session-Time}, \
                 framedipaddress  = '%{Framed-IP-Address}' \
          WHERE  acctuniqueid = '%{Acct-Unique-Session-Id}' \
            AND  acctstoptime IS NULL"
      }

      stop {
        query = "\
          UPDATE radacct \
          SET    acctstoptime       = TO_TIMESTAMP(%{integer:Event-Timestamp}), \
                 acctupdatetime     = NOW(), \
                 acctsessiontime    = %{Acct-Session-Time}, \
                 acctinputoctets    = %{Acct-Input-Octets}, \
                 acctoutputoctets   = %{Acct-Output-Octets}, \
                 acctterminatecause = '%{Acct-Terminate-Cause}', \
                 framedipaddress    = '%{Framed-IP-Address}', \
                 connectinfo_stop   = '%{Connect-Info}' \
          WHERE  acctuniqueid = '%{Acct-Unique-Session-Id}'"
      }
    }
  }

  # ── Post-auth query ───────────────────────────────────────
  # Must use inline `query =` directly — NOT `reference = "queries.post-auth"`.
  # The `queries.post-auth` reference is only valid when using the default
  # mods-config/sql/postgresql/queries.conf file, which we are not using.
  post-auth {
    query = "\
      INSERT INTO radpostauth \
        (username, pass, reply, nasipaddress, nasportid, authdate, class) \
      VALUES \
        ('%{SQL-User-Name}', \
         '%{%{User-Password}:-Chap-Password}', \
         '%{reply:Packet-Type}', \
         '%{NAS-IP-Address}', \
         '%{NAS-Port-Id}', \
         NOW(), \
         '%{Class}')"
  }
}
